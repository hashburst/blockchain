name: HashBurst adaptive resource canary v1
on:
  pull_request:
    paths:
      - 'hvm-network/deploy/mainnet/adaptive-resource/**'
      - '.github/workflows/hvm-mainnet-controlled.yml'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 hvm-network/deploy/mainnet/adaptive-resource/test_orchestrator.py
      - run: python3 hvm-network/deploy/mainnet/adaptive-resource/test_actuator.py
      - run: python3 hvm-network/deploy/mainnet/adaptive-resource/test_canary.py
