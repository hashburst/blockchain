name: HVM consolidated candidate packages
on:
  push:
    branches: [codex/hvm-release-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: hvm-network/go.sum
      - run: go -C hvm-network test -race ./cmd/hvm-qc-audit ./consensus ./wallet
      - run: python3 -m py_compile hvm-network/deploy/runtime/collect-qc-evidence.py
  packages:
    needs: audit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: hvm-network/go.sum
      - name: Build source-bound candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}" CGO_ENABLED=0
          bundle="HashBurst-HVM-v0.7.0-rc.2-${TARGET}"
          mkdir "$bundle"
          commands='hashburst-wallet hvm-apow-miner hvm-qc-audit'
          suffix=''
          if [ "$GOOS" = windows ]; then
            suffix='.exe'
            commands='hashburst-wallet hvm-qc-audit'
            printf '%s\n' 'WINDOWS WALLET AND QC AUDITOR ONLY. Node and APoW miner require Unix-dependent EVM locking and are not included.' > "$bundle/PLATFORM.txt"
          else
            commands="$commands hashburst-testnet hashburst-mainnet"
          fi
          for command in $commands; do
            go -C hvm-network build -trimpath -o "$GITHUB_WORKSPACE/$bundle/$command$suffix" "./cmd/$command"
          done
          printf '%s\n' "$GITHUB_SHA" > "$bundle/SOURCE_COMMIT"
          printf '%s\n' 'CANDIDATE. Does not activate mainnet or authorize a legacy import.' > "$bundle/STATUS.txt"
          cp hvm-network/deploy/release/ACCEPTANCE-20261003.md "$bundle/"
          cp hvm-network/deploy/mainnet/economics.draft.json "$bundle/"
          (cd "$bundle" && sha256sum * > SHA256SUMS)
          tar -czf "$bundle.tar.gz" "$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: hvm-v0.7.0-rc.2-${{ matrix.target }}
          path: HashBurst-HVM-v0.7.0-rc.2-*.tar.gz
          if-no-files-found: error
          retention-days: 30
  publish-candidate:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hvm-v0.7.0-rc.2-*
          path: candidate-assets
          merge-multiple: true
      - name: Publish immutable candidate, never activate networks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='hvm-network-v0.7.0-rc.2'
          count=$(find candidate-assets -maxdepth 1 -name '*.tar.gz' | wc -l)
          test "$count" -eq 5
          if gh release view "$tag" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Existing candidate retained unchanged. This run provides artifacts only; no tag/assets overwritten.'
            exit 0
          fi
          (cd candidate-assets && sha256sum *.tar.gz > SHA256SUMS)
          cp hvm-network/deploy/release/ACCEPTANCE-20261003.md candidate-assets/NOTES.md
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> candidate-assets/NOTES.md
          gh release create "$tag" candidate-assets/*.tar.gz candidate-assets/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title 'HVM v0.7.0-rc.2 — consolidated testnet candidate' --notes-file candidate-assets/NOTES.md
