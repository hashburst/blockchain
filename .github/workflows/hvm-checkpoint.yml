name: HVM recovery checkpoint
on:
  pull_request:
    paths: ['hvm-network/**', '.github/workflows/hvm-checkpoint.yml']
concurrency:
  group: hvm-checkpoint-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: hvm-network/go.sum
      - name: Checkpoint and full regression
        working-directory: hvm-network
        run: |
          gofmt -w blockchain/recovery_checkpoint*.go blockchain/open_existing.go blockchain/storage.go blockchain/replay_v2.go blockchain/blockchain.go blockchain/consensus_v2.go hvm/state.go consensus/registry.go internal/testnet/state.go internal/testnet/run.go cmd/hashburst-testnet/main.go cmd/hashburst-mainnet/main.go
          go test ./blockchain -run 'TestRecoveryCheckpoint|TestRecoveryIndexed' -count=1 -v -timeout 180s
      - name: Full regression
        working-directory: hvm-network
        run: go test ./... -count=1 -timeout 12m
      - name: Race and recovery safety
        working-directory: hvm-network
        run: go test -race ./blockchain -run 'RecoveryCheckpoint|PersistentRecovery|LockConflict|APoW|EVMHistorical' -count=1 -timeout 10m
      - name: Mainnet identity isolation
        working-directory: hvm-network
        run: go test -race ./internal/mainnetidentity ./cmd/hvm-mainnet-identity -count=1
      - name: Deployment guards
        run: python3 hvm-network/deploy/checkpoint/test_upgrade.py
      - name: Build candidate
        working-directory: hvm-network
        run: |
          mkdir -p candidate
          CGO_ENABLED=0 go build -trimpath -o candidate/hashburst-testnet ./cmd/hashburst-testnet
          CGO_ENABLED=0 go build -trimpath -o candidate/hashburst-mainnet ./cmd/hashburst-mainnet
          git rev-parse HEAD > candidate/SOURCE_COMMIT
          cp deploy/checkpoint/upgrade-node.py deploy/checkpoint/test_upgrade.py deploy/checkpoint/README.md candidate/
          cp deploy/testnet/apow/*.py candidate/
          CGO_ENABLED=0 go build -trimpath -o candidate/hvm-apow-audit ./cmd/hvm-apow-audit
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          p=pathlib.Path('candidate');source=(p/'SOURCE_COMMIT').read_text().strip()
          for binary,manifest in [('hashburst-testnet','runtime-release.json'),('hvm-apow-audit','audit-release.json')]:
              (p/manifest).write_text(json.dumps({'chain_id':4735490,'sha256':hashlib.sha256((p/binary).read_bytes()).hexdigest(),'source_commit':source},indent=2)+'\n')
          PYCODE
          cd candidate
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hvm-checkpoint-linux-amd64
          path: hvm-network/candidate/
