name: HVM mainnet controlled fleet
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Authorized phase
        required: true
        type: choice
        options: [preflight, benchmark, diagnostics, orchestrator-dryrun, actuator-simulate, actuator-canary-153, identities, checkpoint, deploy, acceptance]
permissions:
  contents: read
concurrency:
  group: hvm-mainnet-controlled-fleet
  cancel-in-progress: false
jobs:
  fleet:
    runs-on: [self-hosted, linux, x64, hashburst-control, founder-180]
    environment: hvm-mainnet-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce coordinator identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '77.90.188.180')" = "77.90.188.180"
          test -r /etc/hashburst-control/fleet_known_hosts
          test -r /etc/hashburst-control/fleet_ed25519
          test "$(stat -c '%a' /etc/hashburst-control/fleet_ed25519)" = "640"
      - name: Confirm authorized dispatch phase
        shell: bash
        env:
          AUTHORIZED_PHASE: ${{ github.event.inputs.phase }}
        run: |
          set -euo pipefail
          case "$AUTHORIZED_PHASE" in
            preflight|benchmark|diagnostics|orchestrator-dryrun|actuator-simulate|actuator-canary-153|identities|checkpoint|deploy|acceptance) ;;
            *) echo "Invalid or missing authorized phase: $AUTHORIZED_PHASE" >&2; exit 64 ;;
          esac
          echo "HVM_AUTHORIZED_PHASE=$AUTHORIZED_PHASE"

      - name: Read-only preflight
        if: github.event.inputs.phase == 'preflight'
        shell: bash
        env:
          HOME: /var/lib/hashburst-actions
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i /etc/hashburst-control/fleet_ed25519 -o UserKnownHostsFile=/etc/hashburst-control/fleet_known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"
          python3 hvm-network/deploy/mainnet/preflight.py | tee mainnet-preflight.log
      - name: Benchmark gate
        if: github.event.inputs.phase == 'benchmark'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/run-benchmark.sh
          hvm-network/deploy/mainnet/run-benchmark.sh
      - name: Read-only HashBurst load diagnostics
        if: github.event.inputs.phase == 'diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/load-diagnostics.sh
          hvm-network/deploy/mainnet/load-diagnostics.sh
      - name: HashBurst Adaptive Resource Orchestrator dry-run
        if: github.event.inputs.phase == 'orchestrator-dryrun'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/adaptive-resource/run-dryrun.sh
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_orchestrator.py | tee mainnet-orchestrator-policy-tests.log
          hvm-network/deploy/mainnet/adaptive-resource/run-dryrun.sh | tee mainnet-orchestrator-dryrun.log
      - name: HashBurst Adaptive Resource Actuator simulation
        if: github.event.inputs.phase == 'actuator-simulate'
        shell: bash
        run: |
          set -euo pipefail
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_actuator.py | tee mainnet-actuator-simulation.log
          printf '%s\n' '{"schema":"hashburst-actuator-gate-v1","backend":"simulation","remote_mutation":false,"systemd_mutation":false,"miner_restart":false,"status":"passed"}' > mainnet-actuator-simulation.json
          echo HASHBURST_ADAPTIVE_RESOURCE_ACTUATOR_SIMULATION_GATE_OK
      - name: HashBurst Adaptive Resource Actuator canary .153
        if: github.event.inputs.phase == 'actuator-canary-153'
        shell: bash
        env:
          HASHBURST_CANARY_WINDOW_SECONDS: '120'
        run: |
          set -euo pipefail
          python3 hvm-network/deploy/mainnet/check-freeze.py | tee mainnet-canary-freeze.log
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_orchestrator.py | tee mainnet-canary-policy-tests.log
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_actuator.py | tee mainnet-canary-actuator-tests.log
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_canary.py | tee mainnet-canary-scope-tests.log
          python3 hvm-network/deploy/mainnet/adaptive-resource/test_telemetry_v2.py | tee mainnet-telemetry-v2-tests.log
          test -x hvm-network/deploy/mainnet/adaptive-resource/run-canary.sh
          hvm-network/deploy/mainnet/adaptive-resource/run-canary.sh | tee mainnet-actuator-canary.log
      - name: Mutation phases are fail-closed until protocol freeze
        if: github.event.inputs.phase == 'identities' || github.event.inputs.phase == 'checkpoint' || github.event.inputs.phase == 'deploy' || github.event.inputs.phase == 'acceptance'
        shell: bash
        run: |
          set -euo pipefail
          test -f hvm-network/deploy/mainnet/protocol.freeze.json
          test -f hvm-network/deploy/mainnet/economics.freeze.json
          python3 hvm-network/deploy/mainnet/check-freeze.py | tee mainnet-freeze.log
          test -x hvm-network/deploy/mainnet/run-phase.sh
          hvm-network/deploy/mainnet/run-phase.sh "${{ github.event.inputs.phase }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hvm-mainnet-${{ github.event.inputs.phase }}-${{ github.run_id }}
          path: |
            mainnet-*.json
            mainnet-*.log
          if-no-files-found: ignore
          retention-days: 90
