name: HVM mainnet controlled fleet
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Authorized phase
        required: true
        type: choice
        options: [preflight, benchmark, diagnostics, consensus-diagnostics, evidence-recovery, identities, checkpoint, founder-checkpoint, runtime-acceptance, runtime-provision, activation-readiness, apow-production-service, deploy, acceptance]
permissions:
  contents: read
concurrency:
  group: hvm-mainnet-controlled-fleet
  cancel-in-progress: false
jobs:
  fleet:
    runs-on: [self-hosted, linux, x64, hashburst-control, founder-180]
    environment: hvm-mainnet-production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkpoint gate executable
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/run-checkpoint-preparation.sh
          test "$(git ls-files -s hvm-network/deploy/mainnet/run-checkpoint-preparation.sh | awk '{print $1}')" = "100755"
          test -x hvm-network/deploy/mainnet/run-founder-signed-checkpoint.sh
          test "$(git ls-files -s hvm-network/deploy/mainnet/run-founder-signed-checkpoint.sh | awk '{print $1}')" = "100755"
          echo "HVM_CHECKPOINT_GATE_EXECUTABLE_MODE_OK"
          echo "HVM_R6_GATE_EXECUTABLE_MODE_OK"
          bash -n hvm-network/deploy/mainnet/run-runtime-acceptance.sh
          echo "HVM_R7_RUNTIME_ACCEPTANCE_BASH_SYNTAX_OK"
          bash -n hvm-network/deploy/mainnet/run-runtime-provision.sh
          echo "HVM_R7B_RUNTIME_PROVISION_BASH_SYNTAX_OK"
          python3 hvm-network/deploy/mainnet/test-runtime-acceptance-boundary.py
          python3 hvm-network/deploy/mainnet/test-runtime-provision-boundary.py
          bash -n hvm-network/deploy/mainnet/run-activation-readiness.sh
          echo "HVM_R7C_ACTIVATION_READINESS_BASH_SYNTAX_OK"
          python3 hvm-network/deploy/mainnet/test-activation-readiness-boundary.py
          bash -n hvm-network/deploy/mainnet/run-apow-production-service.sh
          echo "HVM_R8A_APOW_PRODUCTION_SERVICE_BASH_SYNTAX_OK"
          python3 hvm-network/deploy/mainnet/test-apow-production-service-boundary.py
      - name: Enforce coordinator identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -I | tr ' ' '\n' | grep -Fx '77.90.188.180')" = "77.90.188.180"
          test -r /etc/hashburst-control/fleet_known_hosts
          test -e /etc/hashburst-control/fleet_ed25519
          test "$(stat -c '%a' /etc/hashburst-control/fleet_ed25519)" = "600"
          test "$(stat -c '%U:%G' /etc/hashburst-control/fleet_ed25519)" = "root:root"
          test -S /run/hashburst-control/ssh-agent.sock
          test -r /run/hashburst-control/ssh-agent.sock
          test "$(SSH_AUTH_SOCK=/run/hashburst-control/ssh-agent.sock ssh-add -l | wc -l)" = "1"
          SSH_AUTH_SOCK=/run/hashburst-control/ssh-agent.sock ssh-add -l | grep -F 'SHA256:yvsyCOCv11WL/oeoxb6uo+Bb/yV46ouxhshw8ohqS1Y'
      - name: Confirm authorized dispatch phase
        shell: bash
        env:
          AUTHORIZED_PHASE: ${{ github.event.inputs.phase }}
        run: |
          set -euo pipefail
          case "$AUTHORIZED_PHASE" in
            preflight|benchmark|diagnostics|consensus-diagnostics|evidence-recovery|identities|checkpoint|founder-checkpoint|runtime-acceptance|runtime-provision|activation-readiness|apow-production-service|deploy|acceptance) ;;
            *) echo "Invalid or missing authorized phase: $AUTHORIZED_PHASE" >&2; exit 64 ;;
          esac
          echo "HVM_AUTHORIZED_PHASE=$AUTHORIZED_PHASE"

      - name: Read-only preflight
        if: github.event.inputs.phase == 'preflight'
        shell: bash
        env:
          HOME: /var/lib/hashburst-actions
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i /etc/hashburst-control/fleet_ed25519 -o UserKnownHostsFile=/etc/hashburst-control/fleet_known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes"
          python3 hvm-network/deploy/mainnet/preflight.py | tee mainnet-preflight.log
      - name: Benchmark gate
        if: github.event.inputs.phase == 'benchmark'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/run-benchmark.sh
          hvm-network/deploy/mainnet/run-benchmark.sh
      - name: Read-only HashBurst load diagnostics
        if: github.event.inputs.phase == 'diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/load-diagnostics.sh
          hvm-network/deploy/mainnet/load-diagnostics.sh

      - name: Read-only R7B consensus diagnostics
        if: github.event.inputs.phase == 'consensus-diagnostics'
        shell: bash
        env:
          SSH_AUTH_SOCK: /run/hashburst-control/ssh-agent.sock
        run: |
          set -euo pipefail
          bash -n hvm-network/deploy/mainnet/consensus-diagnostics.sh
          bash hvm-network/deploy/mainnet/consensus-diagnostics.sh

      - name: Recover exact legacy freeze evidence
        if: github.event.inputs.phase == 'evidence-recovery'
        shell: bash
        run: |
          set -euo pipefail
          test -x hvm-network/deploy/mainnet/recover-freeze-evidence.sh
          hvm-network/deploy/mainnet/recover-freeze-evidence.sh
      - name: Mutation phases are fail-closed until protocol freeze
        if: github.event.inputs.phase == 'identities' || github.event.inputs.phase == 'checkpoint' || github.event.inputs.phase == 'founder-checkpoint' || github.event.inputs.phase == 'runtime-acceptance' || github.event.inputs.phase == 'runtime-provision' || github.event.inputs.phase == 'activation-readiness' || github.event.inputs.phase == 'apow-production-service' || github.event.inputs.phase == 'deploy' || github.event.inputs.phase == 'acceptance'
        shell: bash
        env:
          SSH_AUTH_SOCK: /run/hashburst-control/ssh-agent.sock
        run: |
          set -euo pipefail
          test -f hvm-network/deploy/mainnet/protocol.freeze.json
          test -f hvm-network/deploy/mainnet/economics.freeze.json
          python3 hvm-network/deploy/mainnet/check-freeze.py | tee mainnet-freeze.log
          test -f hvm-network/deploy/mainnet/run-phase.sh
          case "${{ github.event.inputs.phase }}" in
            identities)
              bash hvm-network/deploy/mainnet/run-phase.sh identities
              ;;
            checkpoint)
              test -x hvm-network/deploy/mainnet/run-checkpoint-preparation.sh
              bash hvm-network/deploy/mainnet/run-checkpoint-preparation.sh
              ;;
            founder-checkpoint)
              test -x hvm-network/deploy/mainnet/run-founder-signed-checkpoint.sh
              bash hvm-network/deploy/mainnet/run-founder-signed-checkpoint.sh
              ;;
            runtime-acceptance)
              bash hvm-network/deploy/mainnet/run-runtime-acceptance.sh
              ;;
            runtime-provision)
              bash hvm-network/deploy/mainnet/run-runtime-provision.sh
              ;;
            activation-readiness)
              bash -n hvm-network/deploy/mainnet/run-activation-readiness.sh
              bash hvm-network/deploy/mainnet/run-activation-readiness.sh
              ;;
            apow-production-service)
              bash -n hvm-network/deploy/mainnet/run-apow-production-service.sh
              bash hvm-network/deploy/mainnet/run-apow-production-service.sh
              ;;
            deploy|acceptance)
              echo "Requested mutation phase remains fail-closed pending its dedicated reviewed gate." >&2
              exit 78
              ;;
          esac
      - name: Verify deploy and acceptance remain fail-closed
        if: github.event.inputs.phase == 'identities' || github.event.inputs.phase == 'checkpoint' || github.event.inputs.phase == 'founder-checkpoint' || github.event.inputs.phase == 'runtime-acceptance' || github.event.inputs.phase == 'runtime-provision' || github.event.inputs.phase == 'activation-readiness' || github.event.inputs.phase == 'apow-production-service'
        shell: bash
        run: |
          set -euo pipefail
          for phase in deploy acceptance; do
            if bash hvm-network/deploy/mainnet/run-phase.sh "$phase" >/dev/null 2>&1; then
              echo "Unexpectedly authorized mutation phase: $phase" >&2
              exit 1
            fi
          done
          echo "HVM_DEPLOY_ACCEPTANCE_PHASES_FAIL_CLOSED_OK"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hvm-mainnet-${{ github.event.inputs.phase }}-${{ github.run_id }}
          path: |
            mainnet-*.json
            mainnet-*.log
            hvm-network/mainnet-*.json
            hvm-network/mainnet-*.log
            hvm-network/mainnet-founder-*.public.json
          if-no-files-found: ignore
          retention-days: 90
