name: HVM mainnet freeze candidate
on:
  pull_request:
    paths:
      - 'hvm-network/deploy/mainnet/protocol.freeze.json'
      - 'hvm-network/deploy/mainnet/economics.freeze.json'
      - 'hvm-network/deploy/mainnet/check-freeze.py'
      - 'hvm-network/blockchain/mainnet_freeze_test.go'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
          cache-dependency-path: hvm-network/go.sum
      - run: python3 hvm-network/deploy/mainnet/check-freeze.py
      - run: go -C hvm-network test ./blockchain -run '^TestMainnetProductionFreezeCandidateValidates$' -count=1
