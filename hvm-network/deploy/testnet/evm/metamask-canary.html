<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVM Network — MetaMask testnet canary</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#101827;color:#e7edf7}input{width:95%;padding:10px;margin:8px 0}button{padding:12px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style>
<h1>HVM Network · testnet 4735490</h1><p>Collaudo manuale MetaMask. Richiede un endpoint EVM attivato e un account testnet finanziato. Il test richiede tre conferme nel wallet: trasferimento di 1 wei a sé stessi, deploy e chiamata di un contratto. Non usa chiavi del validatore.</p>
<label>Endpoint HTTPS JSON-RPC EVM<input id="url" type="url" placeholder="https://… endpoint EVM testnet verificato"></label>
<button id="connect">Collega MetaMask alla testnet</button><button id="run" disabled>Esegui le tre transazioni testnet</button><button id="download" disabled>Scarica prova pubblica</button><pre id="output"></pre>
<script>
'use strict';let wallet,account,endpoint,proof={chainId:4735490,checks:[]};const el=id=>document.getElementById(id);const log=s=>el('output').textContent+=s+'\n';
async function rpc(method,params=[]){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(data.error)throw Error(JSON.stringify(data.error));return data.result}
async function requireChain(){if(await wallet.request({method:'eth_chainId'})!=='0x484202')throw Error('Rete diversa dalla testnet: operazione interrotta')}
el('connect').onclick=async()=>{try{endpoint=new URL(el('url').value);if(endpoint.protocol!=='https:')throw Error('Serve HTTPS');endpoint=endpoint.href;const wallets=window.ethereum?.providers||[window.ethereum];wallet=wallets.find(p=>p?.isMetaMask);if(!wallet)throw Error('MetaMask non disponibile');if(await rpc('eth_chainId')!=='0x484202')throw Error('Chain ID RPC non valido');await wallet.request({method:'wallet_addEthereumChain',params:[{chainId:'0x484202',chainName:'HashBurst HVM Testnet',nativeCurrency:{name:'Test HBT',symbol:'tHBT',decimals:18},rpcUrls:[endpoint]}]});await wallet.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x484202'}]});await requireChain();[account]=await wallet.request({method:'eth_requestAccounts'});if(BigInt(await rpc('eth_getBalance',[account,'latest']))===0n)throw Error('Account da finanziare sulla testnet');proof.account=account;proof.endpoint=endpoint;log('Account testnet: '+account);el('run').disabled=false}catch(e){log('STOP: '+e.message)}};
async function transaction(tx,label){await requireChain();const gas=await rpc('eth_estimateGas',[{from:account,...tx}]);const hash=await wallet.request({method:'eth_sendTransaction',params:[{from:account,...tx,gas}]});log(label+': '+hash);const until=Date.now()+180000;while(Date.now()<until){const receipt=await rpc('eth_getTransactionReceipt',[hash]);if(receipt){if(receipt.status!=='0x1')throw Error(label+' reverted');const block=await rpc('eth_getBlockByNumber',[receipt.blockNumber,false]);if(block.hash!==receipt.blockHash)throw Error('Receipt/block mismatch');proof.checks.push({label,hash,receipt});return receipt}await new Promise(r=>setTimeout(r,2000))}throw Error('Attesa receipt scaduta; conservare hash e non reinviare alla cieca')}
el('run').onclick=async()=>{el('run').disabled=true;try{await transaction({to:account,value:'0x1'},'transfer');const deploy=await transaction({data:'0x600b600c600039600b6000f3602a60005560006000a000'},'deploy');if(!deploy.contractAddress)throw Error('Contract address assente');const call=await transaction({to:deploy.contractAddress,data:'0x'},'call');if(BigInt(await rpc('eth_getStorageAt',[deploy.contractAddress,'0x0','latest']))!==42n)throw Error('Storage mismatch');const logs=await rpc('eth_getLogs',[{blockHash:call.blockHash,address:deploy.contractAddress}]);if(!logs.some(l=>l.transactionHash===call.transactionHash))throw Error('Log assente');proof.completedAt=new Date().toISOString();proof.result='METAMASK_TESTNET_MANUAL_CANARY_OK';log(proof.result);el('download').disabled=false}catch(e){proof.error=e.message;log('STOP: '+e.message);el('download').disabled=false}};
el('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(proof,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='hvm-metamask-public-proof.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
