location = /api/hashburst/hvm/testnet/evm {
    limit_req zone=hvm_testnet_req burst=10 nodelay;
    limit_req_status 429;
    limit_conn hvm_testnet_ip 4;
    limit_conn hvm_testnet_total 64;
    limit_conn_status 429;
    client_max_body_size 270000;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:18011/rpc;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-HVM-EVM testnet always;
    proxy_cache off;
}
location = /api/hashburst/hvm/testnet/evm/ws {
    limit_req zone=hvm_testnet_req burst=10 nodelay;
    limit_req_status 429;
    limit_conn hvm_testnet_ip 4;
    limit_conn hvm_testnet_total 64;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:18011/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 3s;
    proxy_read_timeout 650s;
    proxy_send_timeout 10s;
    proxy_cache off;
}
location = /hvm-testnet-metamask/ {
    alias /opt/hashburst-hvm-evm-gateway/metamask-canary.html;
    default_type text/html;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
}
