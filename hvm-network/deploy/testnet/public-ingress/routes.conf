location = /api/hashburst/hvm/testnet/health {
    limit_req zone=hvm_testnet_req burst=10 nodelay;
    limit_req_status 429;
    limit_conn hvm_testnet_ip 4;
    limit_conn hvm_testnet_total 64;
    limit_conn_status 429;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:18010/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_cache off;
}

location = /api/hashburst/hvm/testnet/rpc {
    if ($request_method = OPTIONS) { return 204; }
    limit_req zone=hvm_testnet_req burst=10 nodelay;
    limit_req_status 429;
    limit_conn hvm_testnet_ip 4;
    limit_conn hvm_testnet_total 64;
    limit_conn_status 429;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:18010/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 10s;
    proxy_cache off;
}

location = /api/hashburst/hvm/testnet/ws {
    limit_req zone=hvm_testnet_req burst=10 nodelay;
    limit_req_status 429;
    limit_conn hvm_testnet_ip 4;
    limit_conn hvm_testnet_total 64;
    limit_conn_status 429;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:18009/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_cache off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 40s;
}
